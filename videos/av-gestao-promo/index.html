<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1080" />
    <script src="vendor/gsap.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1080px;
        height: 1080px;
        overflow: hidden;
        background: #000;
      }
      #root {
        position: relative;
        width: 1080px;
        height: 1080px;
        overflow: hidden;
        background: #0b1120;
      }
      .scene {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="30"
      data-width="1080"
      data-height="1080"
    >
      <div
        id="el-01-hook"
        class="scene"
        data-composition-id="01-hook"
        data-composition-src="compositions/frames/01-hook.html"
        data-start="0"
        data-duration="5.6"
        data-track-index="0"
      ></div>

      <div
        id="el-02-dor"
        class="scene"
        data-composition-id="02-dor"
        data-composition-src="compositions/frames/02-dor.html"
        data-start="5"
        data-duration="4.9"
        data-track-index="1"
      ></div>

      <div
        id="el-03-pilares"
        class="scene"
        data-composition-id="03-pilares"
        data-composition-src="compositions/frames/03-pilares.html"
        data-start="9.5"
        data-duration="8.5"
        data-track-index="0"
      ></div>

      <div
        id="el-04-promessa"
        class="scene"
        data-composition-id="04-promessa"
        data-composition-src="compositions/frames/04-promessa.html"
        data-start="17.5"
        data-duration="4.4"
        data-track-index="1"
      ></div>

      <div
        id="el-05-prova"
        class="scene"
        data-composition-id="05-prova"
        data-composition-src="compositions/frames/05-prova.html"
        data-start="21.5"
        data-duration="5"
        data-track-index="0"
      ></div>

      <div
        id="el-06-cta"
        class="scene"
        data-composition-id="06-cta"
        data-composition-src="compositions/frames/06-cta.html"
        data-start="26"
        data-duration="4"
        data-track-index="1"
      ></div>

    </div>

    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
      // ── frame transitions (injected by transitions.mjs) ──
      (function () { var tl = window.__timelines["main"];
        tl.to("#el-01-hook", { filter: "blur(10px)", scale: 1.03, opacity: 0, duration: 0.6, ease: "power2.inOut" }, 5);
        tl.fromTo("#el-02-dor", { filter: "blur(10px)", scale: 0.97, opacity: 0 }, { filter: "blur(0px)", scale: 1, opacity: 1, duration: 0.6, ease: "power2.inOut" }, 5);
        tl.to("#el-02-dor", { scale: 2.5, opacity: 0, filter: "blur(8px)", duration: 0.4, ease: "power3.in" }, 9.5);
        tl.fromTo("#el-03-pilares", { scale: 0.5, opacity: 0, filter: "blur(8px)" }, { scale: 1, opacity: 1, filter: "blur(0px)", duration: 0.4, ease: "power3.out" }, 9.5);
        tl.to("#el-03-pilares", { opacity: 0, duration: 0.5, ease: "power2.inOut" }, 17.5);
        tl.fromTo("#el-04-promessa", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.inOut" }, 17.5);
        tl.to("#el-04-promessa", { scale: 2.5, opacity: 0, filter: "blur(8px)", duration: 0.4, ease: "power3.in" }, 21.5);
        tl.fromTo("#el-05-prova", { scale: 0.5, opacity: 0, filter: "blur(8px)" }, { scale: 1, opacity: 1, filter: "blur(0px)", duration: 0.4, ease: "power3.out" }, 21.5);
        tl.to("#el-05-prova", { opacity: 0, duration: 0.5, ease: "power2.inOut" }, 26);
        tl.fromTo("#el-06-cta", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.inOut" }, 26);
        tl.to({}, { duration: 30 }, 0); // full-span anchor — main.duration() == composition total (Studio master duration)
      })();
    </script>
  </body>
</html>
