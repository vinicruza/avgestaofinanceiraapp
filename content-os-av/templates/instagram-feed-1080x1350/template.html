<!doctype html>
<!--
  Template: Instagram Feed 4:5 (1080x1350)
  Estrutura apenas. Cores/fontes/CTA vêm de brand/*.json, textos vêm do
  briefing. A engine (src/template-engine.mjs) faz o preenchimento de forma
  determinística: mesma entrada -> mesma saída, sempre.
  O logo é sempre a imagem real referenciada por {{LOGO_SRC}} (data URI a
  partir de um arquivo em assets/logos/**) — nunca um SVG/desenho gerado.
-->
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <title>{{BRAND_DISPLAY_NAME}} — arte</title>
    <style>
      {{TEMPLATE_CSS}}
    </style>
  </head>
  <body>
    <div
      class="canvas"
      style="
        --bg: {{BG_COLOR}};
        --bg-soft: {{BG_SOFT_COLOR}};
        --surface: {{SURFACE_COLOR}};
        --text: {{TEXT_COLOR}};
        --text-muted: {{TEXT_MUTED_COLOR}};
        --accent: {{ACCENT_COLOR}};
        --cta-bg: {{CTA_BG_COLOR}};
        --cta-text: {{CTA_TEXT_COLOR}};
        --font-family: {{FONT_FAMILY}};
        --eyebrow-weight: {{EYEBROW_WEIGHT}};
        --headline-weight: {{HEADLINE_WEIGHT}};
        --body-weight: {{BODY_WEIGHT}};
      "
    >
      <div class="glow"></div>

      <div class="logo-row">
        <img src="{{LOGO_SRC}}" alt="{{BRAND_DISPLAY_NAME}}" />
      </div>

      <div class="content">
        <!--IF:EYEBROW-->
        <p class="eyebrow">{{EYEBROW}}</p>
        <!--ENDIF:EYEBROW-->

        <h1 class="headline">{{HEADLINE}}</h1>

        <!--IF:SUBHEADLINE-->
        <p class="subheadline">{{SUBHEADLINE}}</p>
        <!--ENDIF:SUBHEADLINE-->

        <!--IF:BODY-->
        <p class="body-text">{{BODY}}</p>
        <!--ENDIF:BODY-->
      </div>

      <div class="footer-row">
        <span class="cta">{{CTA_LABEL}}</span>
        <!--IF:SHOW_BRAND_NAME-->
        <span class="brand-name">{{BRAND_DISPLAY_NAME}}</span>
        <!--ENDIF:SHOW_BRAND_NAME-->
      </div>
    </div>
  </body>
</html>
